[project]
name = "labs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "falkordblite>=0.9.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "multilspy>=0.0.15",
    "openai>=2.32.0",
    "pydantic>=2.13.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-java>=0.23.5",
    "uvicorn>=0.46.0",
]

[project.scripts]
rigel = "rigel_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigel_demo"]
exclude = [
    "src/rigel_demo/web/frontend/node_modules",
    "src/rigel_demo/web/frontend/dist",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/rigel_demo/web/frontend/node_modules",
    "src/rigel_demo/web/frontend/dist",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
