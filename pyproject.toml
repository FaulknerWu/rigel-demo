[project]
name = "rigel-demo"
version = "0.1.0"
description = "Rigel 本地代码图谱演示 CLI。"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "falkordblite>=0.9.0",
    "fastapi>=0.136.1",
    "falkordb>=1.2.0",
    "langchain>=1.1.4",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.4",
    "langgraph>=1.0.4",
    "multilspy",
    "openai>=2.32.0",
    "pydantic>=2.13.3",
    "requests>=2.32.5",
    "tree-sitter>=0.25.2",
    "tree-sitter-java>=0.23.5",
    "uvicorn>=0.46.0",
]

[project.scripts]
rigel = "rigel_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigel_demo"]
exclude = [
    "src/rigel_demo/web/frontend/node_modules",
    "src/rigel_demo/web/frontend/dist",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/rigel_demo/web/frontend/node_modules",
    "src/rigel_demo/web/frontend/dist",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
multilspy = { git = "https://github.com/microsoft/multilspy.git", tag = "v0.1.0" }

[tool.uv]
override-dependencies = [
    "requests>=2.32.5",
]
