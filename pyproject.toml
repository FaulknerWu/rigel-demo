[project]
name = "labs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "falkordblite>=0.9.0",
    "multilspy>=0.0.15",
    "tree-sitter>=0.25.2",
    "tree-sitter-java>=0.23.5",
]

[project.scripts]
rigel = "rigel_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigel_demo"]
